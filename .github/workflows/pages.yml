name: Website

# The homepage and the docs of each furnish version in versions.json. Daily as well, so docs
# changes on furnish's main branch reach the site without a push here.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out each furnish version
        run: |
          for ref in $(jq -r '.[].ref' versions.json); do
            dir="furnish/$ref"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 https://github.com/furnish-self-service/furnish.git "$ref"
            git -C "$dir" checkout -q --detach FETCH_HEAD
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
